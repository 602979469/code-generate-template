# ============================================================
# 主测试场景：全功能配置（枚举 + json + 强制转换 + 逻辑删除 + 内部表）
# 输出到 /Users/jakt/IdeaProjects/aitest
# ============================================================
globalLogicDelete:
  enable: true
  column_name: del_flag
  normal_value: 0
  delete_value: 1

projectPrefix: AiTest
toolPrefix: AiTest
groupId: com.jakt
projectArtifactPrefix: aitest

jdbc:
  url: jdbc:mysql://localhost:3306/aitest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  username: root
  password: "123456"

outputDir: /Users/jakt/IdeaProjects/aitest

tables:
  - db_table_name: sys_dept
    model_name: Dept
    model_comment: 部门

  - db_table_name: sys_job_log
    model_name: JobLog
    model_comment: 任务日志
    generateController: false
    columns:
      user_type:
        type: enum
        enum:
          className: JobUserTypeEnum
          codeType: Integer
          values:
            - { code: 0, name: SYSTEM_USER, desc: 系统用户 }
            - { code: 1, name: NORMAL_USER, desc: 普通用户 }
      status:
        type: enum
        enum:
          className: JobStatusEnum
          codeType: String
          values:
            - { code: SUCCESS, name: SUCCESS, desc: 执行成功 }
            - { code: FAILED, name: FAILED, desc: 执行失败 }

  - db_table_name: member
    model_name: Member
    model_comment: 会员
    logicDelete:
      enable: true
      column_name: del_flag
      normal_value: 0
      delete_value: 2
