# 场景：codeType: Long 枚举（预判 R1：BaseEnum 缺 Long 重载 → 编译失败）
projectPrefix: LongTest
toolPrefix: LongTest
groupId: com.jakt
projectArtifactPrefix: longtest

jdbc:
  url: jdbc:mysql://localhost:3306/aitest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  username: root
  password: "123456"

outputDir: /tmp/aitest-tests/longenums

tables:
  - db_table_name: sys_job_log
    model_name: JobLog
    model_comment: 任务日志
    generateController: false
    columns:
      cost_time:
        type: enum
        enum:
          className: CostTimeEnum
          codeType: Long
          values:
            - { code: 0, name: FAST, desc: 快速 }
            - { code: 1000, name: SLOW, desc: 慢速 }
