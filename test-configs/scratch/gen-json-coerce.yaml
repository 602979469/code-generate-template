# 场景：json 列配置 type: String / Integer（对照 aiplatform generate-example.yaml 的 tables 形状）
# 预期：当前实现应可生成（String=直接映射，Integer=强制转换）
projectPrefix: AiTest
toolPrefix: AiTest
groupId: com.jakt
projectArtifactPrefix: aitest

jdbc:
  url: jdbc:mysql://localhost:3306/aitest?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
  username: root
  password: "123456"

outputDir: /tmp/cgt-tests/json-coerce

tables:
  - db_table_name: example
    model_name: Example
    model_comment: 示例
    columns:
      user_type:
        type: enum
        enum:
          className: UserTypeEnum
          codeType: Integer
          values:
            - { code: 0, name: SYSTEM_USER, desc: 系统用户 }
            - { code: 1, name: NORMAL_USER, desc: 普通用户 }
      status:
        type: enum
        enum:
          className: UserStatusEnum
          codeType: String
          values:
            - { code: ENABLED,  name: ENABLED,  desc: 启用 }
            - { code: DISABLED, name: DISABLED, desc: 停用 }
      login_count:
        type: Integer
      tags:
        type: Integer               # json 数组列 → 直接强制转 Integer
      profile:
        type: String                # json 对象列 → 保持 String（与默认映射一致）
