# ============================================================
# code-generate-template 生成配置
# 项目命名全部必填,不设默认值(命令行传参优先级最高)
# ============================================================

# -p 项目前缀(驼峰,用于启动类名): 如 AiProd
projectPrefix=

# -tp 工具类/异常/常量前缀(驼峰,由你自己指定,代码不做转换): 如 AiProd
toolPrefix=

# -g Maven groupId: 如 com.jakt
groupId=

# -a artifactId/包名后缀(小写字母数字,Java 包名不允许连字符): 如 aiprod
projectArtifactPrefix=

# 数据库连接(生成表级 CRUD 时使用)
jdbc.url=jdbc:mysql://localhost:3306/aiplatform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
jdbc.username=root
jdbc.password=123456

# 表名前缀:生成类名时剥离,如 sys_ + dept -> Dept
tablePrefix=sys_

# 生成输出根目录(table 命令的落点,默认当前目录)
outputDir=.
