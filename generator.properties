# ============================================================
# code-generate-template 生成配置
# 新项目/新表只需要改这个文件（或命令行覆盖）
# ============================================================

# 项目前缀类名：AiPlatform / AiProd，所有 ${projectPrefix}Xxx 类由此推导
projectPrefix=AiProd

# Maven groupId
groupId=com.jakt

# artifactId/包名后缀：aiprod（默认取 projectPrefix 小写）
# basePackage = ${groupId}.${projectArtifactPrefix}，即 com.jakt.aiprod
projectArtifactPrefix=aiprod

# 数据库连接（生成表级 CRUD 时使用）
jdbc.url=jdbc:mysql://localhost:3306/aiplatform?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
jdbc.username=root
jdbc.password=123456

# 表名前缀：生成类名时剥离，如 sys_ + dept -> Dept
tablePrefix=sys_

# 生成输出根目录（table 命令的落点，默认当前目录）
outputDir=.
